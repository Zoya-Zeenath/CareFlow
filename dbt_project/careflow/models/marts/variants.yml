version: 2

models:
  - name: case_variants
    description: One row per patient with the full path they took as a single text string.
    columns:
      - name: case_id
        tests: [not_null, unique]
      - name: variant_path
        tests: [not_null]

  - name: variant_summary
    description: One row per distinct patient journey (variant), most common first.
    columns:
      - name: variant_path
        tests: [not_null, unique]
      - name: patients
        tests: [not_null]
