version: 2

models:
  - name: stg_ehr_events
    description: Cleaned, de-duplicated EHR events.
    columns:
      - name: case_id
        tests: [not_null]
      - name: activity_name
        tests:
          - not_null
          - accepted_values:
              values: ['Arrival', 'Registration', 'Triage', 'Doctor Consultation',
                       'X-Ray', 'Lab Test', 'Treatment', 'Re-Triage',
                       'Discharge', 'Admission']
      - name: lifecycle
        tests:
          - not_null
          - accepted_values:
              values: ['start', 'complete']
      - name: event_timestamp
        tests: [not_null]
      - name: severity
        tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5]
              quote: false

  - name: event_log
    description: >
      Process-mining event log (Case_ID, Activity_Name, Timestamp).
      Completed activities only, ordered per patient.
    columns:
      - name: case_id
        tests: [not_null]
      - name: activity_name
        tests: [not_null]
      - name: timestamp
        tests: [not_null]
      - name: event_seq
        tests: [not_null]

  - name: event_log_lifecycle
    description: Start and complete events, used for wait-time vs service-time analysis.

  - name: activity_durations
    description: One row per activity instance with queue wait and service time in minutes.
    columns:
      - name: case_id
        tests: [not_null]
      - name: wait_minutes
        tests: [not_null]
      - name: service_minutes
        tests: [not_null]

  - name: transition_stats
    description: Average wait/service/transition time for every node-to-node hand-off.

  - name: bottleneck_summary
    description: Activities ranked by total hours patients spend waiting for them.
    columns:
      - name: activity_name
        tests: [not_null, unique]

  - name: case_summary
    description: One row per patient with stay length, waiting time and loop-back flag.
    columns:
      - name: case_id
        tests: [not_null, unique]
